name: Test PSX Endpoint

on:
  workflow_dispatch:

jobs:
  test-psx-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run isolated PSX test (MARI only)
        run: python test_psx.py
